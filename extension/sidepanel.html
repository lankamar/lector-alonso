<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Lector Alonso</title>
    <style>
      * { box-sizing: border-box; }
      body { min-width: 280px; min-height: 100vh; margin: 0; padding: 16px; color: #f1f5f9; background: #090d16; font: 14px system-ui, sans-serif; }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      h1 { margin: 0; color: #38bdf8; font-size: 19px; }
      label { display: block; margin: 12px 0 5px; color: #cbd5e1; font-weight: 600; }
      textarea, input, select, button { width: 100%; box-sizing: border-box; padding: 9px; border: 1px solid #334155; border-radius: 7px; color: #f8fafc; background: #111827; font: inherit; }
      textarea { min-height: 42vh; resize: vertical; line-height: 1.5; }
      input[type="range"] { padding: 4px; accent-color: #0ea5e9; }
      input[type="file"] { font-size: 12px; }
      .rate-row { display: flex; align-items: center; gap: 10px; }
      #rate-value { min-width: 45px; color: #7dd3fc; text-align: right; }
      .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 9px; }
      button { border: 0; background: #0284c7; font-weight: 700; cursor: pointer; }
      button.secondary { background: #334155; }
      #status { min-height: 20px; margin-top: 10px; color: #7dd3fc; font-size: 12px; }
      #version { margin-top: 12px; color: #64748b; text-align: right; font-size: 11px; }
      .hint { margin: 8px 0; color: #94a3b8; font-size: 12px; }
    </style>
  </head>
  <body>
    <header><h1>🎙️ Lector Alonso</h1></header>
    <div id="status" role="status" aria-live="polite"></div>
    <p class="hint">Copiá una respuesta y tocá “Pegar y leer”, o seleccioná texto en la página. También podés pegarlo/editarlo en el campo.</p>
    <label for="text">Texto para leer</label>
    <textarea id="text" placeholder="El texto seleccionado aparece aquí. También podés pegar o editar texto."></textarea>
    <div class="button-row">
      <button class="secondary" id="read-selection">Leer selección</button>
      <button id="clipboard-read">📋 Pegar y leer</button>
    </div>
    <button class="secondary" id="ocr-visible" style="width:100%;margin-top:9px">📷 OCR + leer página visible</button>
    <div class="button-row">
      <button id="read">▶ Leer texto</button>
      <button class="secondary" id="clear">Limpiar texto</button>
    </div>
    <label for="document">Cargar documento o foto (PDF, TXT, MD, Word, PNG/JPG)</label>
    <input id="document" type="file" accept=".pdf,.txt,.md,.doc,.docx,.png,.jpg,.jpeg,.webp,.bmp,.tif,.tiff">
    <div class="button-row">
      <button class="secondary" id="pause">⏸ Pausar / reanudar</button>
      <button class="secondary" id="stop">⏹ Detener</button>
    </div>

    <label for="voice">Voz</label>
    <select id="voice">
      <option value="es-US-AlonsoNeural">Alonso — Latino neutro</option>
      <option value="es-AR-TomasNeural">Tomás — Argentina</option>
      <option value="es-AR-ElenaNeural">Elena — Argentina</option>
      <option value="es-MX-JorgeNeural">Jorge — México</option>
      <option value="es-MX-DaliaNeural">Dalia — México</option>
      <option value="es-ES-AlvaroNeural">Álvaro — España</option>
    </select>
    <label for="rate">Velocidad: <span id="rate-value">+20%</span></label>
    <div class="rate-row">
      <input id="rate" type="range" min="-30" max="80" step="5" value="20">
      <span id="rate-output" aria-hidden="true">+20%</span>
    </div>

    <details>
      <summary style="margin-top:14px;cursor:pointer;color:#cbd5e1">Conexión del servidor</summary>
      <label for="backend">URL del backend TTS</label>
      <input id="backend" type="url" value="http://127.0.0.1:8000">
      <label for="access-token">Token privado del servidor</label>
      <input id="access-token" type="password" autocomplete="off" placeholder="Solo si el servidor lo requiere">
      <button class="secondary" id="save" style="margin-top:9px">Guardar ajustes</button>
    </details>
    <div id="version"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
